<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Andújar</title>
<style>
body{margin:0;background:#121008;color:#e8d5a3;font-family:system-ui}
#hud{background:#000;padding:10px;border-bottom:2px solid #c5a059;position:sticky;top:0}
#map{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;padding:8px;max-width:600px;margin:auto}
.tile{aspect-ratio:1;background:#3d6b22;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;cursor:pointer}
.village{background:#c5a059!important;color:#000}
.house{background:#8d6e63!important}.barracks{background:#8a2a2a!important}
button{width:100%;padding:10px;margin-top:6px;border-radius:8px;border:0;font-weight:bold}
.bgold{background:#c5a059}.bdark{background:#222;color:#e8d5a3;border:1px solid #c5a059}
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:99}
#box{background:#1e1a12;border:2px solid #c5a059;padding:14px;border-radius:12px;width:90%;max-width:320px}
</style></head><body>
<div id="hud">
<b>ANDÚJAR - SI VES ESTO YA FUNCIONA</b><br>
🍞<span id="food">500</span> 🪵<span id="wood">200</span> 🪨<span id="stone">80</span> 🪙<span id="gold">100</span><br>
👥 Pobres:<span id="pp">0</span> Acom:<span id="mp">0</span> Nobles:<span id="np">0</span> Soldados:<span id="sp">0</span><br>
<span id="info"></span>
</div>
<div id="map"></div>
<div id="modal"><div id="box"></div></div>
<script>
let FOOD=500,WOOD=200,STONE=80,GOLD=100,SOLD=0,sel=0,tiles=[];
for(let i=0;i<100;i++){if(i==44){tiles.push({v:true});continue;} tiles.push({f:40+Math.random()*60|0,w:0,h:null,b:false});}
function tax(h){return h=='s'?2:h=='m'?8:h=='b'?24:0;}
function pops(){let p=0,m=0,n=0;tiles.forEach(t=>{if(t.h=='s')p+=4;if(t.h=='m')m+=8;if(t.h=='b')n+=16});return{p,m,n,tot:p+m+n,work:p+m};}
function workers(){return tiles.reduce((a,t)=>a+(t.w||0),0);}
function draw(){
 let map=document.getElementById('map');map.innerHTML='';
 tiles.forEach((t,i)=>{
  let d=document.createElement('div');d.className='tile '+(t.v?'village':t.b?'barracks':t.h?'house':'');
  d.innerHTML=t.v?'🏛️':t.b?`⚔️ ${SOLD}`:t.h?(t.h=='s'?'🏠':t.h=='m'?'🏘️':'🏰'):`${t.f|0}% ${t.w||''}`;
  d.onclick=()=>openT(i);map.appendChild(d);
 });
 let po=pops();
 document.getElementById('pp').innerText=po.p;document.getElementById('mp').innerText=po.m;document.getElementById('np').innerText=po.n;document.getElementById('sp').innerText=SOLD;
 document.getElementById('food').innerText=FOOD|0;document.getElementById('wood').innerText=WOOD|0;document.getElementById('stone').innerText=STONE|0;document.getElementById('gold').innerText=GOLD|0;
 let prod=0,tx=0;tiles.forEach(t=>{if(t.w)prod+=t.w*20*(t.f/100);if(t.h)tx+=tax(t.h);});
 document.getElementById('info').innerText=`Prod ${prod|0} - Cons ${po.tot+SOLD*2} = Bal ${prod-po.tot-SOLD*2|0} | Imp +${tx} | Libres ${po.work-workers()}`;
}
function openT(i){sel=i;let t=tiles[i];let box=document.getElementById('box');if(t.v)return;
 let po=pops();let free=po.work-workers()+(t.w||0);
 if(t.b){box.innerHTML=`<h3>Cuartel ${SOLD} Soldados</h3>Reclutables ${po.tot-workers()-SOLD}<br><button class="bgold" onclick="SOLD++;draw();openT(${i})">Reclutar 1 (todos, incluso nobles)</button><button class="bdark" onclick="if(SOLD>0)SOLD--;draw();openT(${i})">Licenciar</button><button class="bdark" onclick="tiles[${i}].b=false;draw();closeM()">Demoler</button><button class="bdark" onclick="closeM()">Cerrar</button>`;}
 else if(t.h){box.innerHTML=`<h3>${t.h=='b'?'Noble NO trabaja':'Casa'}</h3>Impuesto ${tax(t.h)}<br><button class="bdark" onclick="tiles[${i}].h=null;draw();closeM()">Demoler</button><button class="bdark" onclick="closeM()">Cerrar</button>`;}
 else{box.innerHTML=`Parcela ${t.f|0}%<br>Obreros <span id="wc">${t.w||0}</span> / ${free}<br><input id="r" type="range" min="0" max="${free}" value="${t.w||0}" style="width:100%" oninput="document.getElementById('wc').innerText=this.value"><br><button class="bgold" onclick="tiles[sel].w=parseInt(document.getElementById('r').value);closeM();draw()">Asignar (Nobles NO pueden)</button><hr><button class="bdark" onclick="if(WOOD>=20){WOOD-=20;tiles[sel].h='s';closeM();draw()}">🏠 Pobre 4hab 20🪵 2🪙</button><button class="bdark" onclick="if(WOOD>=60&&STONE>=10){WOOD-=60;STONE-=10;tiles[sel].h='m';closeM();draw()}">🏘️ Acom 8hab 60🪵10🪨 8🪙</button><button class="bdark" onclick="if(WOOD>=140&&STONE>=40){WOOD-=140;STONE-=40;tiles[sel].h='b';closeM();draw()}">🏰 Noble 16hab 140🪵40🪨 24🪙 NO trabaja</button><button class="bgold" onclick="if(WOOD>=100&&STONE>=50){WOOD-=100;STONE-=50;tiles[sel].b=true;closeM();draw()}">⚔️ Cuartel 100🪵50🪨</button><button class="bdark" onclick="closeM()">Cerrar</button>`;}
 document.getElementById('modal').style.display='flex';
}
function closeM(){document.getElementById('modal').style.display='none';}
draw();
setInterval(()=>{let prod=0,tx=0;tiles.forEach(t=>{if(t.w)prod+=t.w*20*(t.f/100);if(t.h)tx+=tax(t.h);});let po=pops();FOOD+=prod-po.tot-SOLD*2;GOLD+=tx;draw();},6000);
</script></body></html>
