<!DOCTYPE html>
<html>
<head>
<title>Andújar - Prototipo Tierras</title>
<style>
  body { margin:0; background:#2a1a0a; color:#f0d9a0; font-family: monospace; }
  #ui { position:absolute; top:10px; left:10px; background:#000a; padding:15px; border:1px solid #8a6d3b; width:300px; }
  input[type=range] { width: 100%; }
  #map { margin-left: 340px; }
 .tile { width:32px; height:32px; display:inline-block; border:1px solid #000; cursor:pointer; }
</style>
</head>
<body>
<div id="ui">
  <h3>ALDEA - 50 ha</h3>
  Ciudadanos: <span id="total">100</span><br><br>
  Granjeros: <span id="vFarm">0</span> <input type="range" id="rFarm" min="0" max="100" value="40"><br>
  Soldados: <span id="vSold">0</span> <input type="range" id="rSold" min="0" max="100" value="20"><br>
  Libres: <span id="vFree">0</span><br><hr>
  Comida producida: <span id="foodProd">0</span>/mes<br>
  Consumo: <span id="foodCons">0</span>/mes<br>
  Balance: <span id="balance" style="font-weight:bold">0</span><br><hr>
  <button id="btnLegion">Crear Legión Permanente</button>
  <div id="legionInfo">Legión: 0 tropas esperando</div>
</div>
<canvas id="map" width="640" height="640"></canvas>

<script>
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
const tiles = [];
for(let y=0;y<20;y++){ tiles[y]=[]; for(let x=0;x<20;x++){ tiles[y][x]={fert: Math.random()>0.7?100:20, owner:false}; } }

let citizens = 100, farmers=40, soldiers=20, legionTroops=0;
const rFarm=document.getElementById('rFarm'), rSold=document.getElementById('rSold');

function update() {
  farmers = parseInt(rFarm.value);
  soldiers = parseInt(rSold.value);
  if(farmers+soldiers>100){
    if(document.activeElement==rFarm) rSold.value=100-farmers;
    else rFarm.value=100-soldiers;
    farmers=parseInt(rFarm.value); soldiers=parseInt(rSold.value);
  }
  let free = 100-farmers-soldiers;
  document.getElementById('vFarm').innerText=farmers;
  document.getElementById('vSold').innerText=soldiers;
  document.getElementById('vFree').innerText=free;

  // Realista: 1 granjero = 2 ha max. Tienes 50 ha.
  let haWorked = Math.min(farmers*2, 50);
  let prodPerHa = 50 * (farmers*2 <=50? 1 : 50/(farmers*2)); // si sobre-asignas, baja eficiencia
  let foodProd = Math.floor(haWorked * prodPerHa);
  let foodCons = free*1 + farmers*1 + soldiers*2; // soldado come doble

  document.getElementById('foodProd').innerText=foodProd;
  document.getElementById('foodCons').innerText=foodCons;
  let bal = foodProd - foodCons;
  document.getElementById('balance').innerText=bal;
  document.getElementById('balance').style.color=bal<0?'red':'lightgreen';
}

function draw() {
  ctx.clearRect(0,0,640,640);
  for(let y=0;y<20;y++) for(let x=0;x<20;x++){
    ctx.fillStyle=tiles[y][x].fert==100?'#5a8a3a':'#8a7a5a';
    ctx.fillRect(x*32,y*32,30,30);
  }
}
rFarm.oninput=()=>{update();}; rSold.oninput=()=>{update();};
document.getElementById('btnLegion').onclick=()=>{
  legionTroops+=soldiers;
  document.getElementById('legionInfo').innerText=`Legión: ${legionTroops} tropas esperando órdenes (consume ${legionTroops*2} comida/mes extra)`;
};
update(); draw();
</script>
</body>
</html>
